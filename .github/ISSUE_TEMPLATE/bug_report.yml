name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in PayrollPro
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or commit are you running?
      placeholder: e.g. main @ abc1234
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, PHP version, Node version, database driver, browser.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04
        - PHP: 8.2 / 8.3
        - Node: 20.x
        - DB: MySQL 8 / PostgreSQL / SQLite
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs & Screenshots
      description: Relevant logs, stack traces, or screenshots (drag & drop).
    validations:
      required: false
